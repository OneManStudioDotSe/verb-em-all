appId: com.sotiris.verbemall
productName: "Verb 'em all"
copyright: Copyright © 2026 Sotiris Falieris

directories:
  buildResources: resources
  output: dist-release

files:
  - "out/**/*"

# Icons the running app loads at runtime (tray + dev dock icon).
# They land in Contents/Resources on macOS and resources/ on Windows,
# and are read via process.resourcesPath (see src/main/resources.ts).
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray-icon.png
    to: tray-icon.png

artifactName: "${productName}-${version}-${arch}.${ext}"

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Notarization runs only when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID are set in the environment; otherwise it is skipped.
  notarize: true

dmg:
  title: "Verb 'em all"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
