name: Release

# Pushing a tag like v1.0.0 builds the macOS DMGs and attaches them to a
# GitHub Release. Code signing and notarization are optional: add the secrets
# listed in _docs/RUNNING.md and the same workflow produces a notarized build.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # CSC_LINK must be unset, not empty, when there is no certificate:
      # electron-builder treats an empty CSC_LINK as a file path and fails.
      - name: Configure code signing
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            echo "CSC_LINK=$MAC_CERT_P12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
      - run: npx electron-builder --mac --publish never
      - name: Attach DMGs to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes dist-release/*.dmg \
            || gh release upload "${GITHUB_REF_NAME}" dist-release/*.dmg --clobber
